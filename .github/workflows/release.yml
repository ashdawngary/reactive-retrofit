name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v5

      - name: Set up Java, Maven Central, and GPG
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Require the tag to match a release version
        shell: bash
        run: |
          version="$(mvn --quiet help:evaluate -Dexpression=project.version -DforceStdout)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == *-SNAPSHOT || "$version" != "$tag_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match release version $version" >&2
            exit 1
          fi

      - name: Verify supported Reactor versions
        run: ./scripts/verify-reactor-matrix.sh

      - name: Verify build and dependency declarations
        run: mvn --batch-mode clean verify dependency:analyze

      - name: Sign and publish to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn --batch-mode --activate-profiles release -DskipTests deploy

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
